---
- name: Importing PostgreSQL GPG-key
  rpm_key:
    state: present
    key: "{{ postgres_gpg_key }}"
  when: postgres_install_from_pgdg_repo | default(false)

- name: Installing PostgreSQL repository
  dnf:
    name: "{{ postgres_repo_link }}"
    state: present
  when: postgres_install_from_pgdg_repo | default(false)

- name: Disabling PostgreSQL module from standard repositories
  shell: dnf -qy module disable postgresql
  when: postgres_install_from_pgdg_repo | default(false)

- name: Installing PostgreSQL packages
  dnf:
    name:
      - "{{ ('@postgresql:' + postgres_version) if not postgres_install_from_pgdg_repo else ('postgresql' + postgres_version) }}"
      - "{{ ('@postgresql:' + postgres_version + '/server') if not postgres_install_from_pgdg_repo else ('postgresql' + postgres_version + '-server') }}"
      - "{{ ('@postgresql:' + postgres_version + '/client') if not postgres_install_from_pgdg_repo else ('postgresql' + postgres_version + '-contrib') }}"
    state: present

- name: Initializing PostgreSQL data base
  command: >
    {{ (postgres_pgdg_bin_path ~ '/postgresql-' ~ postgres_version ~ '-setup initdb')
       if postgres_install_from_pgdg_repo else
       'postgresql-setup --initdb' }}
  args:
    creates: "{{ postgres_data_dir }}/PG_VERSION"

- name: Setting owner and access rights to data directory
  file:
    path: "{{ postgres_data_dir }}"
    recurse: true
    owner: "{{ postgres_user }}"
    group: "{{ postgres_group }}"
    mode: '0750'

- name: Creating PostgreSQL logs directory
  file:
    path: "{{ postgres_log_directory }}"
    owner: "{{ postgres_user }}"
    group: "{{ postgres_group }}"
    mode: '0750'
    state: directory