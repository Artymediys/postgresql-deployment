---
# env vars from gitlab-ci
service_name: "{{ service }}"
service_env: "{{ environment }}"

role_id: "{{ lookup('env','INS_ROLE_ID') }}"
secret_id: "{{ lookup('env','INS_SECRET_ID') }}"
vault_url: "{{ lookup('env','VAULT_ADDR') }}"

secrets_root_path: "company/secrets/ansible/psql"

tech_user_pass: "{{ lookup('hashi_vault', 'secret={{ secrets_root_path }}/{{ service_name }}-{{ service_env }} auth_method=approle role_id={{ role_id }} secret_id={{ secret_id }} url={{ vault_url }}').tech_user }}"