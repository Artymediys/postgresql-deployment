---
- name: Environment variables checking
  hosts: localhost
  connection: local
  become: no
  tasks:
    - fail:
        msg: "Variable 'environment' or 'service' is not specified! Please submit this variable via '-e' flag"
      when:
        - environment is undefined or
          environment == none or
          environment == ''
        - service is undefined or
          service == none or
          service == ''

- name: Installing and configuring PostgreSQL
  hosts: "postgres_{{ environment }}"
  become: true
  roles:
    - postgres_main